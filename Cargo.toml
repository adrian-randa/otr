[package]
name = "otr"
version = "0.1.0"
edition = "2021"

[dependencies]
colored = "3.1.1"
derive_more = { version = "2.0.1", features = ["full"] }
itertools = "0.14.0"
num = { version = "0.4.3", features = ["num-bigint"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_cbor = "0.11.2"
toml = "1.0.7"

[[bin]]
name = "otrc"
path = "./src/compiler/main.rs"
